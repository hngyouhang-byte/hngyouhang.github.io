<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/css-home.css">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="images/logo.png" alt="Positivus Logo" width="120">
        </div>

        <div class="menu">
            <div>About</div>
            <div>Services</div>
            <div>Use Cases</div>
            <div>Pricing</div>
            <div>Blog</div>
            <div class="request-quote">Request a quote</div>



        </div>

        <div class="burger">
            <img src="images/burger.png" alt="Burger" width="30">
        </div>
    </div>

    <div class="banner">
        <div class="banner-title">
            <h1>Navigating the digital landscape
                for success</h1>

            <h2>Our digital marketing agency helps businesses grow and succeed online through a range of services
                including
                SEO, PPC, social media marketing, and content creation.
            </h2>

            <button class="banner-button">Get Started</button>
        </div>

        <div class="banner-image">
            <img src="images/Illustration.png" alt="Banner" width="100%">
        </div>
    </div>

    <div class="logos">
        <div><img src="images/amazon.png" alt="amazon"></div>
        <div><img src="images/dnittte.png" alt="dnittte"></div>
        <div><img src="images/hubspot.png" alt="hubspot"></div>
        <div><img src="images/notion.png" alt="notion"></div>
        <div><img src="images/netflix.png" alt="netflix"></div>
        <div><img src="images/zoom.png" alt="zoom"></div>







    </div>






    </div>
