<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/Index.css">

</head>

<body>
    <div class="navbar">
        <div class="logo-box">
            <img src="image/Logo.png" alt="logo">
            <span>Romaliya</span>
        </div>

        <div class="menu">
            <div class="menu">
                <div>Home</div>
                <div>Menu</div>
                <div>Order</div>
                <div>Promotion</div>
                <div>About Us</div>
                <div>Our Restaurant</div>
            </div>
        </div>
        <div class="logo">
            <div class="cart">
                <img src="image/order 2.png" alt="order">
            </div>
        </div>
        <div class="bergur">
            <img src="image/menu-icon.png" alt="icon">
        </div>
    </div>
    <div class="word">
        <div class="letter">
            <h1>----ROMALIYA TAKEOUT----</h1>
            <p>ORDER ONLINE</p>
        </div>

    </div>
    <div class="second">
        <div class="numeric">
            <h2>FROM OUR KITCHEN TO YOUR TABLE</h2>
            <h3>Choose your favourites</h3>
            <h4>Select a quantity, add your dishes to the cart, then review everything before checkout.</h4>

        </div>
        <div class="numeric-button">
            <button>View Cart</button>
        </div>  
        
    </div>
    <div class="third">
        
        <div class="font">
            <h5>CHEF'S SIGNATURES</h5>
            <h6>FINE DINING FAVORITES</h6>
        </div>

        <div class="food-row">
            <div class="lobster">
                <img src="image/mask.png" alt="mask">
            </div>
            <div class="beef">
                <img src="image/meat.png" alt="meat">
            </div>
        </div> 
    </div>

</div>

















</body>

</html>
